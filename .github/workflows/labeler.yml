name: Labeler

# Label pull requests by the files they change (.github/labeler.yml). pull_request_target lets this label pull
# requests from forks; it is safe because the pull request's code is never checked out or run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
