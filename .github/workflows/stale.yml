name: Stale

# Label issues and pull requests with no activity for 60 days, then close them 14 days later unless someone responds.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: Stale
          stale-pr-label: Stale
          exempt-issue-labels: Work In Progress,Upstream
          exempt-pr-labels: Work In Progress,Upstream,Dependencies
          exempt-draft-pr: true
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in 14 days.
            Comment if it still affects the latest master and it will stay open.
          close-issue-message: >
            Closed after 74 days without activity. Comment or open a new issue if it still affects the latest master.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be closed in 14 days.
            Push a change or comment to keep it open.
          close-pr-message: Closed after 74 days without activity.
